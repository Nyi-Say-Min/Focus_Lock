appId: com.focuslock.desktop
productName: FocusLock
directories:
  output: dist
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - package.json
extraResources:
  - from: resources
    to: resources
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
